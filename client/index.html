<!doctype html>
<html lang="zh-CN" data-theme="jrpg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EchoReader</title>
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EchoReader" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234C7E70'/><path d='M10 9v14M10 9h10M10 16h8M10 23h10' stroke='%23F7F7F3' stroke-width='2.6' fill='none' stroke-linecap='round'/></svg>" />
    <script>
      // Apply the saved theme before first paint (the app's store lives in localStorage).
      try {
        const saved = JSON.parse(localStorage.getItem('echoreader') || '{}');
        let theme = saved.state?.theme;
        // Same rule as the store's v2 migration: the old default ("light") moves to "jrpg".
        if ((saved.version ?? 0) < 2 && (!theme || theme === 'light')) theme = 'jrpg';
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans+SC:wght@900&family=Shippori+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
